<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusPulse - 質感番茄鐘專注計時器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font - Outfit & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        pomo: {
                            work: '#FF5E62',
                            workLight: '#FF9966',
                            short: '#10B981',
                            shortLight: '#34D399',
                            long: '#6366F1',
                            longLight: '#818CF8',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbars & glassmorphism utilities */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(254, 243, 199, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.3);
            border-radius: 9999px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.08);
        }
        /* Floating cards hover effect */
        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -8px rgba(245, 158, 11, 0.25);
            border-color: rgba(245, 158, 11, 0.6);
        }
        .theme-glow {
            transition: all 0.5s ease;
        }
        /* SVG Circle timer transition */
        .timer-circle-path {
            transition: stroke-dashoffset 0.8s ease-in-out, stroke 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-yellow-100/60 to-amber-100 text-slate-800 font-sans min-h-full flex flex-col justify-between selection:bg-amber-400 selection:text-slate-900 relative overflow-x-hidden">

    <!-- Dynamic Background Ambient Blobs -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div id="bg-blob-1" class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-rose-400/30 blur-[100px] theme-glow transition-all duration-700"></div>
        <div id="bg-blob-2" class="absolute top-1/2 -right-32 w-96 h-96 rounded-full bg-amber-300/40 blur-[120px] theme-glow transition-all duration-700"></div>
        <div id="bg-blob-3" class="absolute -bottom-32 left-1/3 w-96 h-96 rounded-full bg-orange-300/30 blur-[110px] theme-glow transition-all duration-700"></div>
    </div>

    <!-- Main Container -->
    <div class="relative z-10 max-w-4xl w-full mx-auto px-4 py-6 sm:py-8 flex-1 flex flex-col items-center">
        
        <!-- Header -->
        <header class="w-full flex items-center justify-between mb-8 pb-4 border-b border-amber-200/80">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center shadow-lg shadow-amber-500/20">
                    <i class="fa-solid font-bold fa-stopwatch text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">
                        Focus<span class="text-amber-600">Pulse</span>
                    </h1>
                    <p class="text-xs text-amber-800/70 font-semibold hidden sm:block">極簡與高度專注的番茄鐘計時器</p>
                </div>
            </div>

            <!-- Action Tools Header -->
            <div class="flex items-center gap-2">
                <button id="sound-toggle-btn" class="p-2.5 rounded-xl glass-card hover:bg-white/90 text-slate-700 transition-all text-sm flex items-center gap-2">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-emerald-600"></i>
                    <span class="hidden md:inline text-xs font-semibold">提示音</span>
                </button>
                <button id="open-settings-btn" class="p-2.5 rounded-xl glass-card hover:bg-white/90 text-slate-700 transition-all text-sm flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-amber-600"></i>
                    <span class="hidden md:inline text-xs font-semibold">設定</span>
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="w-full flex flex-col items-center max-w-lg space-y-6">

            <!-- Mode Selector Switcher -->
            <div class="flex p-1.5 glass-card rounded-2xl w-full justify-between gap-1 shadow-sm">
                <button data-mode="work" class="mode-btn flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r from-amber-500 to-rose-500 text-white shadow-md shadow-amber-500/20">
                    <i class="fa-solid fa-brain"></i>
                    專注工作
                </button>
                <button data-mode="shortBreak" class="mode-btn flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-mug-hot"></i>
                    短暫休息
                </button>
                <button data-mode="longBreak" class="mode-btn flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-couch"></i>
                    長休息
                </button>
            </div>

            <!-- Big Circular Timer Widget -->
            <div class="relative w-72 h-72 sm:w-80 sm:h-80 my-2 flex items-center justify-center">
                <!-- SVG Ring -->
                <svg class="w-full h-full -rotate-90 drop-shadow-lg" viewBox="0 0 200 200">
                    <!-- Background Circle -->
                    <circle 
                        cx="100" cy="100" r="88" 
                        stroke="rgba(251, 191, 36, 0.25)" 
                        stroke-width="12" 
                        fill="none" 
                    />
                    <!-- Dynamic Progress Circle -->
                    <circle 
                        id="progress-ring"
                        class="timer-circle-path"
                        cx="100" cy="100" r="88" 
                        stroke="url(#gradient-work)" 
                        stroke-width="12" 
                        stroke-linecap="round"
                        stroke-dasharray="552.92" 
                        stroke-dashoffset="0" 
                        fill="none" 
                    />
                    <!-- Gradient Definitions -->
                    <defs>
                        <linearGradient id="gradient-work" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#F59E0B" />
                            <stop offset="100%" stop-color="#F43F5E" />
                        </linearGradient>
                        <linearGradient id="gradient-shortBreak" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#10B981" />
                            <stop offset="100%" stop-color="#059669" />
                        </linearGradient>
                        <linearGradient id="gradient-longBreak" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6366F1" />
                            <stop offset="100%" stop-color="#4F46E5" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Timer Inner Info Content -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <!-- Timer Status Indicator Pill -->
                    <div id="current-task-pill" class="text-xs font-bold px-3.5 py-1 rounded-full bg-amber-100/90 border border-amber-300 text-amber-900 shadow-sm mb-2">
                        <i class="fa-solid fa-bolt text-amber-600 mr-1.5"></i>
                        <span id="active-task-display">保持專注狀態</span>
                    </div>

                    <!-- Digits Display -->
                    <div id="timer-display" class="text-6xl sm:text-7xl font-black tracking-tight font-mono text-slate-800 drop-shadow-sm">
                        25:00
                    </div>

                    <!-- Mode Label -->
                    <div id="mode-label" class="text-xs uppercase font-extrabold tracking-widest text-amber-700 mt-2">
                        • Focus Time •
                    </div>
                </div>
            </div>

            <!-- Quick Time Adjustment (+5 Min / -5 Min) -->
            <div class="w-full glass-card rounded-2xl p-3 flex items-center justify-center gap-3 shadow-md">
                <button id="minus-5-btn" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm bg-white hover:bg-amber-100/80 text-amber-900 border border-amber-300/80 shadow-sm hover:shadow transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-minus text-amber-600"></i>
                    -5 分鐘
                </button>
                <button id="plus-5-btn" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-900 border border-amber-400 shadow-md shadow-amber-500/20 transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus text-slate-900"></i>
                    +5 分鐘
                </button>
            </div>

            <!-- Prominent Control Buttons -->
            <div class="flex items-center justify-center gap-4 w-full pt-1">
                <!-- Reset Button -->
                <button id="reset-btn" class="w-14 h-14 rounded-2xl glass-card hover:bg-white text-slate-600 hover:text-slate-900 transition-all flex items-center justify-center text-xl shadow-md active:scale-95">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>

                <!-- Huge Start / Pause Button -->
                <button id="start-btn" class="flex-1 py-4 px-8 rounded-2xl font-black text-xl tracking-wider text-white shadow-xl transition-all transform active:scale-95 flex items-center justify-center gap-3 bg-gradient-to-r from-amber-500 via-rose-500 to-amber-600 shadow-amber-500/30 hover:shadow-amber-500/50 hover:-translate-y-0.5">
                    <i id="start-icon" class="fa-solid fa-play text-2xl"></i>
                    <span id="start-text">開始專注</span>
                </button>

                <!-- Skip Button -->
                <button id="skip-btn" class="w-14 h-14 rounded-2xl glass-card hover:bg-white text-slate-600 hover:text-slate-900 transition-all flex items-center justify-center text-xl shadow-md active:scale-95">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <!-- Stats Summary Cards with Floating Hover Effects -->
            <div class="grid grid-cols-3 gap-3.5 w-full pt-2">
                <div class="glass-card glass-card-hover rounded-2xl p-4 text-center cursor-default">
                    <div class="text-xs text-amber-900/70 font-bold mb-1">已完成番茄</div>
                    <div id="stats-pomodoros" class="text-2xl font-black text-rose-600 font-mono">0</div>
                </div>
                <div class="glass-card glass-card-hover rounded-2xl p-4 text-center cursor-default">
                    <div class="text-xs text-amber-900/70 font-bold mb-1">專注總時長</div>
                    <div id="stats-minutes" class="text-2xl font-black text-amber-600 font-mono">0<span class="text-xs ml-0.5 text-amber-800/60 font-semibold">分鐘</span></div>
                </div>
                <div class="glass-card glass-card-hover rounded-2xl p-4 text-center cursor-default">
                    <div class="text-xs text-amber-900/70 font-bold mb-1">連續天數</div>
                    <div id="stats-streak" class="text-2xl font-black text-emerald-600 font-mono">1<span class="text-xs ml-0.5 text-amber-800/60 font-semibold">天</span></div>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="mt-12 text-center text-xs text-amber-900/60 font-medium">
            <p>Pomodoro Technique® • 保持專注，有效提升生產力</p>
        </footer>
    </div>

    <!-- Settings Modal Drawer -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 shadow-2xl border border-amber-300/80 transform scale-95 transition-transform duration-300 id-settings-content bg-amber-50/95">
            <div class="flex items-center justify-between pb-4 border-b border-amber-200 mb-6">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-amber-600"></i>
                    計時器偏好設定
                </h3>
                <button id="close-settings-btn" class="w-8 h-8 rounded-full bg-amber-200/60 hover:bg-amber-300 text-slate-700 transition-all flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Time Options Inputs -->
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-amber-900/70 mb-2">預設時間長度（分鐘）</label>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <span class="text-xs text-slate-700 block mb-1 font-semibold">工作時間</span>
                            <input type="number" id="setting-work" min="1" max="120" value="25" class="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-center text-slate-900 font-bold text-sm focus:outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <span class="text-xs text-slate-700 block mb-1 font-semibold">短暫休息</span>
                            <input type="number" id="setting-short" min="1" max="60" value="5" class="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-center text-slate-900 font-bold text-sm focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <span class="text-xs text-slate-700 block mb-1 font-semibold">長休息</span>
                            <input type="number" id="setting-long" min="1" max="60" value="15" class="w-full bg-white border border-amber-300 rounded-xl px-3 py-2 text-center text-slate-900 font-bold text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- Auto Switches -->
                <div class="pt-2 border-t border-amber-200 space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-sm font-bold text-slate-800">自動開始休息</div>
                            <div class="text-xs text-slate-500">專注結束後自動倒數休息時間</div>
                        </div>
                        <input type="checkbox" id="setting-autostart-breaks" class="w-5 h-5 rounded accent-amber-500 bg-white border-amber-300 cursor-pointer">
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-sm font-bold text-slate-800">自動開始下個番茄鐘</div>
                            <div class="text-xs text-slate-500">休息結束後自動開始專注</div>
                        </div>
                        <input type="checkbox" id="setting-autostart-work" class="w-5 h-5 rounded accent-amber-500 bg-white border-amber-300 cursor-pointer">
                    </div>
                </div>

                <!-- Save Button -->
                <button id="save-settings-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold text-sm shadow-lg shadow-amber-500/20 hover:opacity-95 transition-all mt-4">
                    儲存變更
                </button>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Sound Generator
        const audioFX = {
            muted: false,
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            },
            playBeep(freq = 600, type = 'sine', duration = 0.1) {
                if (this.muted) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    console.error("Audio playback error", e);
                }
            },
            playAlarm() {
                if (this.muted) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playBeep(freq, 'triangle', 0.35);
                    }, idx * 160);
                });
            }
        };

        // UI Theme Configurations per mode
        const modeThemes = {
            work: {
                label: '• Focus Time •',
                pillText: '保持專注狀態',
                btnClass: 'from-amber-500 to-rose-500 text-white shadow-md shadow-amber-500/20',
                glow1: 'bg-rose-400/30',
                glow2: 'bg-amber-300/40',
                strokeGradient: 'url(#gradient-work)',
                activeText: 'text-amber-700',
                startBtnGradient: 'from-amber-500 via-rose-500 to-amber-600 shadow-amber-500/30 hover:shadow-amber-500/50'
            },
            shortBreak: {
                label: '• Short Break •',
                pillText: '短暫休息時間',
                btnClass: 'from-emerald-500 to-teal-500 text-white shadow-md shadow-emerald-500/20',
                glow1: 'bg-emerald-300/40',
                glow2: 'bg-teal-200/50',
                strokeGradient: 'url(#gradient-shortBreak)',
                activeText: 'text-emerald-700',
                startBtnGradient: 'from-emerald-500 via-teal-500 to-emerald-600 shadow-emerald-500/30 hover:shadow-emerald-500/50'
            },
            longBreak: {
                label: '• Long Break •',
                pillText: '充分放鬆長休息',
                btnClass: 'from-indigo-500 to-purple-500 text-white shadow-md shadow-indigo-500/20',
                glow1: 'bg-indigo-300/40',
                glow2: 'bg-purple-200/50',
                strokeGradient: 'url(#gradient-longBreak)',
                activeText: 'text-indigo-700',
                startBtnGradient: 'from-indigo-500 via-purple-500 to-indigo-600 shadow-indigo-500/30 hover:shadow-indigo-500/50'
            }
        };

        // Application State
        const state = {
            mode: 'work',
            timeRemaining: 25 * 60,
            totalDuration: 25 * 60,
            isRunning: false,
            timerInterval: null,
            completedPomodoros: 0,
            totalFocusMinutes: 0,
            settings: {
                workTime: 25,
                shortTime: 5,
                longTime: 15,
                autoStartBreaks: false,
                autoStartWork: false
            }
        };

        // DOM Elements
        const timerDisplay = document.getElementById('timer-display');
        const modeLabel = document.getElementById('mode-label');
        const activeTaskDisplay = document.getElementById('active-task-display');
        const progressRing = document.getElementById('progress-ring');
        const startBtn = document.getElementById('start-btn');
        const startIcon = document.getElementById('start-icon');
        const startText = document.getElementById('start-text');
        const resetBtn = document.getElementById('reset-btn');
        const skipBtn = document.getElementById('skip-btn');
        const modeBtns = document.querySelectorAll('.mode-btn');
        const bgBlob1 = document.getElementById('bg-blob-1');
        const bgBlob2 = document.getElementById('bg-blob-2');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundIcon = document.getElementById('sound-icon');
        
        // Quick time adjust buttons
        const plus5Btn = document.getElementById('plus-5-btn');
        const minus5Btn = document.getElementById('minus-5-btn');

        // Settings Modal Elements
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const inputWork = document.getElementById('setting-work');
        const inputShort = document.getElementById('setting-short');
        const inputLong = document.getElementById('setting-long');
        const chkAutoBreaks = document.getElementById('setting-autostart-breaks');
        const chkAutoWork = document.getElementById('setting-autostart-work');

        // Stats Elements
        const statsPomodoros = document.getElementById('stats-pomodoros');
        const statsMinutes = document.getElementById('stats-minutes');

        // Load & Save LocalStorage
        function loadLocalStorage() {
            const savedSettings = localStorage.getItem('focuspulse_settings');
            if (savedSettings) {
                try {
                    state.settings = { ...state.settings, ...JSON.parse(savedSettings) };
                    inputWork.value = state.settings.workTime;
                    inputShort.value = state.settings.shortTime;
                    inputLong.value = state.settings.longTime;
                    chkAutoBreaks.checked = state.settings.autoStartBreaks;
                    chkAutoWork.checked = state.settings.autoStartWork;
                } catch(e) {}
            }

            const savedStats = localStorage.getItem('focuspulse_stats');
            if (savedStats) {
                try {
                    const parsedStats = JSON.parse(savedStats);
                    state.completedPomodoros = parsedStats.completedPomodoros || 0;
                    state.totalFocusMinutes = parsedStats.totalFocusMinutes || 0;
                } catch(e) {}
            }

            updateStatsUI();
        }

        function saveLocalStorage() {
            localStorage.setItem('focuspulse_settings', JSON.stringify(state.settings));
            localStorage.setItem('focuspulse_stats', JSON.stringify({
                completedPomodoros: state.completedPomodoros,
                totalFocusMinutes: state.totalFocusMinutes
            }));
        }

        function updateStatsUI() {
            statsPomodoros.textContent = state.completedPomodoros;
            statsMinutes.innerHTML = `${state.totalFocusMinutes}<span class="text-xs ml-0.5 text-amber-800/60 font-semibold">分鐘</span>`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateTimerUI() {
            timerDisplay.textContent = formatTime(state.timeRemaining);
            document.title = `${formatTime(state.timeRemaining)} - FocusPulse`;

            // Circle Progress Ring Offset Calculations (Radius r = 88, Circumference = 552.92)
            const circumference = 552.92;
            const progress = state.totalDuration > 0 ? state.timeRemaining / state.totalDuration : 0;
            const offset = circumference * (1 - progress);
            progressRing.style.strokeDashoffset = offset;
        }

        function switchMode(newMode) {
            pauseTimer();
            state.mode = newMode;
            const theme = modeThemes[newMode];

            // Update Time Duration based on settings
            if (newMode === 'work') {
                state.totalDuration = state.settings.workTime * 60;
            } else if (newMode === 'shortBreak') {
                state.totalDuration = state.settings.shortTime * 60;
            } else if (newMode === 'longBreak') {
                state.totalDuration = state.settings.longTime * 60;
            }
            state.timeRemaining = state.totalDuration;

            // UI Mode Theme updates
            modeLabel.textContent = theme.label;
            modeLabel.className = `text-xs uppercase font-extrabold tracking-widest mt-2 ${theme.activeText}`;
            activeTaskDisplay.textContent = theme.pillText;

            // Update mode switch button styling
            modeBtns.forEach(btn => {
                if (btn.dataset.mode === newMode) {
                    btn.className = `mode-btn flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-300 flex items-center justify-center gap-2 bg-gradient-to-r ${theme.btnClass}`;
                } else {
                    btn.className = 'mode-btn flex-1 py-2.5 px-3 rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition-all duration-300 flex items-center justify-center gap-2';
                }
            });

            // Update Start button gradient & Ring gradient
            startBtn.className = `flex-1 py-4 px-8 rounded-2xl font-black text-xl tracking-wider text-white shadow-xl transition-all transform active:scale-95 flex items-center justify-center gap-3 bg-gradient-to-r ${theme.startBtnGradient}`;
            progressRing.setAttribute('stroke', theme.strokeGradient);

            // Ambient background glow update
            bgBlob1.className = `absolute -top-32 -left-32 w-96 h-96 rounded-full ${theme.glow1} blur-[100px] theme-glow transition-all duration-700`;
            bgBlob2.className = `absolute top-1/2 -right-32 w-96 h-96 rounded-full ${theme.glow2} blur-[120px] theme-glow transition-all duration-700`;

            updateTimerUI();
        }

        function startTimer() {
            if (state.isRunning) return;
            state.isRunning = true;

            startIcon.className = 'fa-solid fa-pause text-2xl';
            startText.textContent = '暫停';

            audioFX.playBeep(650, 'sine', 0.1);

            state.timerInterval = setInterval(() => {
                if (state.timeRemaining > 0) {
                    state.timeRemaining--;
                    updateTimerUI();
                } else {
                    onTimerComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!state.isRunning) return;
            state.isRunning = false;
            clearInterval(state.timerInterval);

            startIcon.className = 'fa-solid fa-play text-2xl';
            startText.textContent = '繼續專注';
            audioFX.playBeep(450, 'sine', 0.1);
        }

        function resetTimer() {
            pauseTimer();
            state.timeRemaining = state.totalDuration;
            startText.textContent = state.mode === 'work' ? '開始專注' : '開始休息';
            updateTimerUI();
            audioFX.playBeep(500, 'sine', 0.1);
        }

        function onTimerComplete() {
            pauseTimer();
            audioFX.playAlarm();

            if (state.mode === 'work') {
                const workMins = state.settings.workTime;
                state.completedPomodoros++;
                state.totalFocusMinutes += workMins;
                saveLocalStorage();
                updateStatsUI();

                // Switch to break mode automatically or prompt
                if (state.completedPomodoros % 4 === 0) {
                    switchMode('longBreak');
                } else {
                    switchMode('shortBreak');
                }

                if (state.settings.autoStartBreaks) {
                    startTimer();
                }
            } else {
                switchMode('work');
                if (state.settings.autoStartWork) {
                    startTimer();
                }
            }
        }

        // Quick adjust time helpers (+5m / -5m)
        plus5Btn.addEventListener('click', () => {
            state.timeRemaining += 5 * 60;
            state.totalDuration += 5 * 60;
            updateTimerUI();
            audioFX.playBeep(750, 'sine', 0.08);
        });

        minus5Btn.addEventListener('click', () => {
            if (state.timeRemaining > 5 * 60) {
                state.timeRemaining -= 5 * 60;
                if (state.totalDuration > 5 * 60) {
                    state.totalDuration -= 5 * 60;
                }
            } else {
                state.timeRemaining = 0;
            }
            updateTimerUI();
            audioFX.playBeep(450, 'sine', 0.08);
        });

        // Event Listeners
        startBtn.addEventListener('click', () => {
            if (state.isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', resetTimer);

        skipBtn.addEventListener('click', () => {
            audioFX.playBeep(550, 'sine', 0.1);
            if (state.mode === 'work') {
                switchMode('shortBreak');
            } else {
                switchMode('work');
            }
        });

        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetMode = btn.dataset.mode;
                if (targetMode !== state.mode) {
                    audioFX.playBeep(600, 'sine', 0.1);
                    switchMode(targetMode);
                }
            });
        });

        soundToggleBtn.addEventListener('click', () => {
            audioFX.muted = !audioFX.muted;
            if (audioFX.muted) {
                soundIcon.className = 'fa-solid fa-volume-xmark text-slate-400';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-emerald-600';
                audioFX.playBeep(700, 'sine', 0.1);
            }
        });

        // Settings Modal Handlers
        openSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            const content = settingsModal.querySelector('.id-settings-content');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            const content = settingsModal.querySelector('.id-settings-content');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
        });

        saveSettingsBtn.addEventListener('click', () => {
            state.settings.workTime = parseInt(inputWork.value) || 25;
            state.settings.shortTime = parseInt(inputShort.value) || 5;
            state.settings.longTime = parseInt(inputLong.value) || 15;
            state.settings.autoStartBreaks = chkAutoBreaks.checked;
            state.settings.autoStartWork = chkAutoWork.checked;

            saveLocalStorage();
            switchMode(state.mode); // Refresh timer with new duration settings

            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            const content = settingsModal.querySelector('.id-settings-content');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            audioFX.playBeep(750, 'sine', 0.12);
        });

        // Initialization on Load
        window.onload = function() {
            loadLocalStorage();
            switchMode('work');
        };
    </script>
</body>
</html>
